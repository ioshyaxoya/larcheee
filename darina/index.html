<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дарина Данилюк</title>
<meta name="description" content="Дарина Данилюк — дипломированный режиссёр игрового и документального кино, хореограф.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" as="image" href="assets/hero.jpg">
<link rel="preload" as="image" href="assets/logo-darina.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── переключатель языка ──────────────────────────────────────────── -->
<nav class="lang" id="lang" aria-label="Язык"></nav>

<!-- ── фиксированные ссылки ─────────────────────────────────────────── -->
<a class="side side-start" href="#about" data-panel="about" data-t="about"></a>
<a class="side side-end" href="#contact" data-panel="contact" data-t="contact"></a>

<!-- ── дека: по экрану на весь вьюпорт ──────────────────────────────── -->
<main id="deck" class="deck">

  <!-- 1. герой — фотография из исходного макета -->
  <section class="section section--hero" data-anchor="1">
    <img class="hero-photo" src="assets/hero.jpg" alt="">
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="hero-logo">
      <img src="assets/logo-darina.svg" alt="Darina Danilyuk">
    </div>
  </section>

  <!-- 2..N. экраны фильмов, анонса и стены собираются из films.js -->

</main>

<!-- ── стрелка вниз ─────────────────────────────────────────────────── -->
<button class="cue" id="cue">↓</button>

<!-- ── индикатор нарезки ────────────────────────────────────────────── -->
<div class="cuts" id="cuts" aria-hidden="true"></div>

<!-- ── оверлеи ──────────────────────────────────────────────────────── -->
<div class="panel" id="panel-about" hidden>
  <button class="panel-close">×</button>
  <div class="panel-inner">
    <h2 data-t="about"></h2>
    <div class="panel-body"></div>
  </div>
</div>

<div class="panel" id="panel-contact" hidden>
  <button class="panel-close">×</button>
  <div class="panel-inner">
    <h2 data-t="contact"></h2>
    <div class="panel-body contacts">
      <a href="https://t.me/darinadanilyuk" target="_blank" rel="noopener">t.me/darinadanilyuk</a>
      <a href="mailto:danilyukk.dar@mail.ru">danilyukk.dar@mail.ru</a>
    </div>
  </div>
</div>

<div class="panel panel--credits" id="panel-credits" hidden>
  <button class="panel-close">×</button>
  <div class="panel-inner">
    <h2 data-t="credits"></h2>
    <div class="credits-film"></div>
    <div class="panel-body"></div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="films.js"></script>
<script src="app.js"></script>
</body>
</html>
