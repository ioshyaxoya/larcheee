<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дарина Данилюк — режиссёр</title>
<meta name="description" content="Дарина Данилюк — дипломированный режиссёр игрового и документального кино, хореограф.">
<link rel="icon" href="assets/favicon.ico" sizes="48x48">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="assets/favicon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preload" as="image" href="assets/portraits/darina-03.jpg">
<link rel="preload" as="image" href="assets/logo-darina.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── переключатель языка ──────────────────────────────────────────── -->
<nav class="lang" id="lang" aria-label="Язык"></nav>

<!-- ── фиксированные ссылки ─────────────────────────────────────────── -->
<a class="side side-start" href="#about" data-panel="about" data-t="about"></a>
<a class="side side-end" href="#contact" data-panel="contact" data-t="contact"></a>

<!-- ── дека: по экрану на весь вьюпорт ──────────────────────────────── -->
<main id="deck" class="deck">

  <!-- 1. герой — фотография из исходного макета -->
  <section class="section section--hero" data-anchor="1">
    <img class="hero-photo" src="assets/portraits/darina-03.jpg" alt="">
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="hero-logo">
      <img src="assets/logo-darina.svg" alt="Darina Danilyuk">
    </div>
  </section>

  <!-- 2..N. экраны фильмов, анонса и стены собираются из films.js -->

</main>

<!-- ── стрелка вниз ─────────────────────────────────────────────────── -->
<button class="cue" id="cue">↓</button>

<!-- ── индикатор нарезки ────────────────────────────────────────────── -->
<div class="cuts" id="cuts" aria-hidden="true"></div>

<!-- ── оверлеи ──────────────────────────────────────────────────────── -->
<div class="panel" id="panel-about" hidden>
  <button class="panel-close">×</button>
  <div class="panel-inner">
    <h2 data-t="about"></h2>
    <div class="panel-body"></div>
  </div>
</div>

<div class="panel" id="panel-contact" hidden>
  <button class="panel-close">×</button>
  <div class="panel-inner">
    <h2 data-t="contact"></h2>
    <div class="panel-body contacts"></div>
  </div>
</div>

<div class="panel panel--credits" id="panel-credits" hidden>
  <button class="panel-close">×</button>
  <div class="panel-inner">
    <h2 data-t="aboutFilm"></h2>
    <div class="credits-film"></div>
    <div class="panel-body"></div>
  </div>
</div>

<div class="panel panel--legal" id="panel-legal" hidden>
  <button class="panel-close">×</button>
  <div class="panel-inner">
    <h2></h2>
    <div class="panel-body"></div>
  </div>
</div>

<!-- просмотр бэкстейджа: кадр целиком, счётчик и автопрокрутка -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" type="button">×</button>

  <figure class="lightbox-stage">
    <img alt="">
    <figcaption></figcaption>
  </figure>

  <div class="lightbox-bar">
    <button class="lightbox-arrow lb-prev" type="button">&#8592;</button>
    <span class="lightbox-count"></span>
    <button class="lightbox-arrow lb-next" type="button">&#8594;</button>
  </div>

  <div class="lightbox-pad">
    <button class="lb-restart" type="button">&#8635;</button>
    <button class="lb-step lb-prev" type="button">&#8249;</button>
    <button class="lb-play" type="button"></button>
    <button class="lb-step lb-next" type="button">&#8250;</button>
  </div>
</div>

<script src="i18n.js"></script>
<script src="films.js"></script>
<script src="app.js"></script>
</body>
</html>
